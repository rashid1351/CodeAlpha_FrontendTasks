<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04180d"/>
      <stop offset="100%" stop-color="#0d381f"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <rect x="35" y="30" width="530" height="320" rx="16" fill="#092917" stroke="#10b981" stroke-width="1.5"/>

  <!-- Top bar -->
  <path d="M35 46 A16 16 0 0 1 51 30 H549 A16 16 0 0 1 565 30 V65 H35 Z" fill="#0f4024"/>
  <text x="60" y="52" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffffff">CricketPro — Digital Match Scoring & Management</text>

  <!-- Live Match Scoreboard Header -->
  <rect x="60" y="85" width="480" height="100" rx="12" fill="#0d4d29" stroke="#10b981" stroke-width="1"/>
  <text x="80" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#facc15">LIVE T20 CHAMPIONSHIP</text>
  <text x="80" y="155" font-family="Space Grotesk, sans-serif" font-size="32" font-weight="800" fill="#ffffff">PAKISTAN <tspan fill="#10b981">186/4</tspan> <tspan font-size="18" fill="#a7f3d0">(18.4 Overs)</tspan></text>
  <text x="80" y="175" font-family="Inter, sans-serif" font-size="11" fill="#6ee7b7">Target: 175 | Required Run Rate: 6.2</text>

  <!-- Recent Balls Widget -->
  <rect x="60" y="200" width="480" height="60" rx="10" fill="#0b381e"/>
  <text x="80" y="235" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#ffffff">THIS OVER:</text>
  
  <circle cx="170" cy="230" r="15" fill="#10b981"/>
  <text x="170" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">4</text>
  
  <circle cx="210" cy="230" r="15" fill="#10b981"/>
  <text x="210" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  
  <circle cx="250" cy="230" r="15" fill="#ef4444"/>
  <text x="250" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">W</text>
  
  <circle cx="290" cy="230" r="15" fill="#10b981"/>
  <text x="290" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  
  <circle cx="330" cy="230" r="15" fill="#f59e0b"/>
  <text x="330" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">6</text>

  <!-- Player Stats Summary -->
  <rect x="60" y="275" width="480" height="55" rx="10" fill="#072413"/>
  <text x="80" y="300" font-family="Inter, sans-serif" font-size="12" fill="#e2e8f0">Striker: <tspan font-weight="700" fill="#ffffff">Babar Azam 74* (42b)</tspan></text>
  <text x="320" y="300" font-family="Inter, sans-serif" font-size="12" fill="#e2e8f0">Bowler: <tspan font-weight="700" fill="#ffffff">Shaheen Afridi 3/28</tspan></text>
</svg>
