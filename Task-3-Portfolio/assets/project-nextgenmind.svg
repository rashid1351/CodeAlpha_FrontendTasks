<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#14192b"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f1626" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g opacity="0.1" stroke="#00f2fe" stroke-width="1">
    <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" />
    <path d="M50 0 V380 M100 0 V380 M150 0 V380 M200 0 V380 M250 0 V380 M300 0 V380 M350 0 V380 M400 0 V380 M450 0 V380 M500 0 V380 M550 0 V380" />
  </g>

  <!-- Mock AI Interface Window -->
  <rect x="40" y="30" width="520" height="320" rx="16" fill="url(#cardGrad)" stroke="#7000ff" stroke-width="1.5"/>
  
  <!-- Window Titlebar -->
  <path d="M40 46 A16 16 0 0 1 56 30 H544 A16 16 0 0 1 560 30 V70 H40 Z" fill="#131a2c"/>
  <circle cx="68" cy="50" r="5" fill="#ff5f56"/>
  <circle cx="84" cy="50" r="5" fill="#ffbd2e"/>
  <circle cx="100" cy="50" r="5" fill="#27c93f"/>
  <text x="300" y="55" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#a0aec0" text-anchor="middle">NextGenMind AI Platform</text>

  <!-- Chat Messages Mockup -->
  <!-- User Bubble -->
  <rect x="260" y="90" width="260" height="45" rx="12" fill="#7000ff" opacity="0.8"/>
  <text x="280" y="117" font-family="Inter, sans-serif" font-size="13" fill="#ffffff">Generate full-stack AI app code architecture...</text>

  <!-- AI Response Bubble -->
  <rect x="70" y="150" width="340" height="90" rx="12" fill="#1e293b" stroke="url(#aiGlow)" stroke-width="1"/>
  <circle cx="95" cy="180" r="14" fill="url(#aiGlow)"/>
  <text x="95" y="184" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">AI</text>
  <text x="122" y="180" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00f2fe">NextGenMind Assistant</text>
  <rect x="122" y="195" width="230" height="8" rx="4" fill="#334155"/>
  <rect x="122" y="210" width="170" height="8" rx="4" fill="#334155"/>

  <!-- Code Preview Snippet -->
  <rect x="70" y="255" width="450" height="75" rx="10" fill="#090d16" stroke="#1e293b"/>
  <text x="90" y="280" font-family="monospace" font-size="12" fill="#38bdf8">const aiResponse = await nextgenmind.query({</text>
  <text x="110" y="298" font-family="monospace" font-size="12" fill="#c084fc">  prompt: "Synthesize LLM output + vector embeddings"</text>
  <text x="90" y="316" font-family="monospace" font-size="12" fill="#38bdf8">});</text>
</svg>
