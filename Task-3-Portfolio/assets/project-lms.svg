<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#152642"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <rect x="35" y="30" width="530" height="320" rx="16" fill="#0e1a30" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M35 46 A16 16 0 0 1 51 30 H549 A16 16 0 0 1 565 30 V65 H35 Z" fill="#142442"/>
  <text x="60" y="52" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffffff">TECHBYRASH LMS — Learning Management Portal</text>

  <!-- Video Player Preview Area -->
  <rect x="60" y="85" width="310" height="180" rx="10" fill="#080f1d" stroke="#1d3557"/>
  <!-- Play button icon overlay -->
  <circle cx="215" cy="175" r="28" fill="url(#cyanGrad)"/>
  <polygon points="210,163 226,175 210,187" fill="#ffffff"/>

  <!-- Video Progress Bar -->
  <rect x="75" y="245" width="280" height="6" rx="3" fill="#1e293b"/>
  <rect x="75" y="245" width="180" height="6" rx="3" fill="#00f2fe"/>

  <!-- Course Curriculum Sidebar -->
  <rect x="385" y="85" width="155" height="240" rx="10" fill="#122038"/>
  <text x="400" y="110" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#00f2fe">Course Modules</text>

  <rect x="395" y="125" width="135" height="36" rx="6" fill="#1b2d4f"/>
  <text x="405" y="147" font-family="Inter, sans-serif" font-size="11" fill="#ffffff">01. Web & SEO Fundamentals</text>

  <rect x="395" y="170" width="135" height="36" rx="6" fill="#1b2d4f"/>
  <text x="405" y="192" font-family="Inter, sans-serif" font-size="11" fill="#ffffff">02. React & Next.js Apps</text>

  <rect x="395" y="215" width="135" height="36" rx="6" fill="#1b2d4f"/>
  <text x="405" y="237" font-family="Inter, sans-serif" font-size="11" fill="#ffffff">03. YouTube Automation</text>

  <!-- Bottom Admin Stats Bar -->
  <rect x="60" y="280" width="310" height="45" rx="8" fill="#122038"/>
  <text x="80" y="307" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">Enrolled Students: <tspan fill="#4ade80" font-weight="700">1,280+</tspan></text>
</svg>
