<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Glowing Sphere / AI Core -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="12 8"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <circle cx="250" cy="250" r="60" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Core Icon text -->
  <text x="250" y="245" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">AI + WEB</text>
  <text x="250" y="268" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#00f2fe" text-anchor="middle">&amp; GROWTH</text>

  <!-- Orbiting Nodes & Lines -->
  <line x1="250" y1="250" x2="100" y2="120" stroke="#00f2fe" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="120" r="28" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <text x="100" y="125" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="middle">LLMs</text>

  <line x1="250" y1="250" x2="400" y2="120" stroke="#7000ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="400" cy="120" r="28" fill="#1e293b" stroke="#7000ff" stroke-width="2"/>
  <text x="400" y="125" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">SEO</text>

  <line x1="250" y1="250" x2="410" y2="370" stroke="#00f2fe" stroke-width="1.5" opacity="0.5"/>
  <circle cx="410" cy="370" r="28" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <text x="410" y="375" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">YouTube</text>

  <line x1="250" y1="250" x2="90" y2="370" stroke="#7000ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="90" cy="370" r="28" fill="#1e293b" stroke="#7000ff" stroke-width="2"/>
  <text x="90" y="375" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">React</text>

  <!-- Floating Code Badges -->
  <rect x="180" y="50" width="140" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="250" y="72" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">&lt;TechByRash /&gt;</text>

  <rect x="180" y="416" width="140" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="250" y="438" font-family="monospace" font-size="11" fill="#00f2fe" text-anchor="middle">rashidazam.me</text>
</svg>
