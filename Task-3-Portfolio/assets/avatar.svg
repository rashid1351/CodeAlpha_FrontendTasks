<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Hexagon Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#accentGlow)" stroke-width="3" opacity="0.4" stroke-dasharray="10 6" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.6"/>

  <!-- Developer Silhouette / Graphic representation -->
  <g filter="url(#glowFilter)">
    <!-- Shield/Logo base -->
    <path d="M200 80 L290 130 V230 L200 310 L110 230 V130 Z" fill="#131b2e" stroke="url(#accentGlow)" stroke-width="3"/>
    
    <!-- Initials Tech Symbol RA -->
    <text x="200" y="210" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      RA
    </text>
    <text x="200" y="245" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#00f2fe" text-anchor="middle" letter-spacing="4">
      TECHBYRASH
    </text>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="110" cy="130" r="6" fill="#00f2fe" filter="url(#glowFilter)"/>
  <circle cx="290" cy="130" r="6" fill="#7000ff" filter="url(#glowFilter)"/>
  <circle cx="200" cy="310" r="6" fill="#00f2fe" filter="url(#glowFilter)"/>
</svg>
